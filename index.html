<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Log in | BA Fitness</title>
    
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BA Fitness">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/a11y.css">
    <script src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@1.76.0/dist/umd/lucide.min.js"></script>
    <script src="js/config.js"></script>
    
    <style>
        [v-cloak] { display: none !important; }
        :root {
            --primary-blue: #3b82f6;
            --logo-primary-color: #3b82f6;
        }

        body { 
            background-color: #020617; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: contain;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .auth-logo {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.6));
            transition: filter 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 320px; 
            max-width: 80vw;
            margin: 0 auto;
        }

        .auth-logo svg {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        .svg-inject path[fill="#FEFEFE"] { fill: var(--logo-primary-color) !important; transition: fill 0.3s; }
        .svg-inject path[fill="#010101"] { fill: #FFFFFF !important; transition: fill 0.3s; }
        
        .fade-enter-active, .fade-leave-active { transition: opacity 0.4s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        .loading-mask {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="font-sans antialiased">

<div id="app" v-cloak class="w-full">
    
    <div v-if="loading" class="loading-mask">
        <div class="animate-pulse flex flex-col items-center gap-4">
            <div class="w-10 h-10 rounded-full border-2 border-blue-500 border-t-transparent animate-spin"></div>
            <p class="text-[8px] font-black uppercase tracking-[0.4em] text-slate-600 italic">Synchronizing</p>
        </div>
    </div>

    <transition name="fade">
        <main v-if="!loading" class="flex flex-col items-center justify-center p-10 w-full max-w-lg mx-auto">
            <div class="mb-12 text-center w-full">
                <div class="flex justify-center w-full mb-8">
                    <div class="svg-inject auth-logo" v-html="logoSvg"></div>
                </div>
                
                <h1 class="text-3xl font-black tracking-tighter uppercase italic text-white leading-none">
                    <span class="text-blue-500">BA</span> FITNESS
                </h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-[0.4em] mt-4 font-black italic">
                    {{ headline }}
                </p>
            </div>
            
            <form class="w-full space-y-4" @submit.prevent="handleAuth">
                <div v-if="mode !== 'reset'">
                    <label for="email" class="sr-only">Email</label>
                    <input id="email" type="email" autocomplete="email" v-model="email" placeholder="Email" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-5 px-8 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white placeholder-slate-400">
                </div>
                <div v-if="mode !== 'forgot'">
                    <label for="password" class="sr-only">{{ mode === 'reset' ? 'New password' : 'Password' }}</label>
                    <input id="password" type="password" :autocomplete="mode === 'login' ? 'current-password' : 'new-password'" v-model="password" :placeholder="mode === 'reset' ? 'New password' : 'Password'" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-5 px-8 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white placeholder-slate-400">
                </div>
                <div v-if="mode === 'reset'">
                    <label for="password2" class="sr-only">Confirm new password</label>
                    <input id="password2" type="password" autocomplete="new-password" v-model="password2" placeholder="Confirm new password" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-5 px-8 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white placeholder-slate-400">
                </div>
                
                <button type="submit" :disabled="processing" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all tracking-tighter uppercase italic flex items-center justify-center">
                    <span v-if="!processing">{{ submitLabel }}</span>
                    <span v-else>CONNECTING...</span>
                </button>

                <div class="text-center pt-4 space-y-3">
                    <button v-if="mode === 'login'" type="button" @click="mode = 'forgot'" class="block w-full text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 hover:text-blue-400 transition-colors">
                        Forgot password?
                    </button>
                    <button v-if="mode === 'login' || mode === 'signup'" type="button" @click="toggleSignUp" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 hover:text-blue-400 transition-colors">
                        {{ mode === 'signup' ? 'Already have a profile? Log In' : 'No account? Create one' }}
                    </button>
                    <button v-if="mode === 'forgot' || mode === 'reset'" type="button" @click="mode = 'login'" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 hover:text-blue-400 transition-colors">
                        Back to log in
                    </button>
                </div>
                
                <p v-if="errorMsg" role="alert" class="text-center text-red-400 text-xs font-bold mt-4 px-4 leading-relaxed">{{ errorMsg }}</p>
                <p v-if="successMsg" role="status" class="text-center text-green-400 text-xs font-bold mt-4 px-4 leading-relaxed">{{ successMsg }}</p>
            </form>
        </main>
    </transition>
</div>

<script>
    const { createApp } = Vue;
    const _client = supabase.createClient(
        'https://mvoyrchefjcpjkdtezmz.supabase.co', 
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12b3lyY2hlZmpjcGprZHRlem16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwNjkxNzksImV4cCI6MjA4MzY0NTE3OX0.o_dh0rMw0RPYWJjn3ssA6OkKY8udy5vhqVQzN50uvEQ'
    );

    createApp({
        data() { 
            return { 
                loading: true, 
                processing: false, 
                mode: 'login',
                email: '', 
                password: '',
                password2: '',
                errorMsg: '',
                successMsg: '',
                logoSvg: '' 
            } 
        },
        computed: {
            headline() {
                if (this.mode === 'signup') return 'Create your profile';
                if (this.mode === 'forgot') return 'Reset your password';
                if (this.mode === 'reset') return 'Choose a new password';
                return 'Performance Lifestyle';
            },
            submitLabel() {
                if (this.mode === 'signup') return 'Create account';
                if (this.mode === 'forgot') return 'Email me a link';
                if (this.mode === 'reset') return 'Save new password';
                return 'Log in';
            }
        },
        watch: {
            mode() {
                this.errorMsg = '';
                this.successMsg = '';
                const titles = {
                    login: 'Log in | BA Fitness',
                    signup: 'Create account | BA Fitness',
                    forgot: 'Reset password | BA Fitness',
                    reset: 'New password | BA Fitness'
                };
                document.title = titles[this.mode] || 'BA Fitness';
            }
        },
        async mounted() {
            // Leave the service worker off. Registering sw.js cached the shell and
            // broke the iOS home-screen app (stale or blank launch).
            if (window.FitnessPwa) await FitnessPwa.disableStaleWorker();

            fetch('c-logo.svg')
                .then(res => res.text())
                .then(data => { this.logoSvg = data; })
                .catch(err => console.error("Logo load failed", err));

            const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
            const recovery = hash.get('type') === 'recovery';
            _client.auth.onAuthStateChange((event) => {
                if (event === 'PASSWORD_RECOVERY') {
                    this.mode = 'reset';
                    this.loading = false;
                }
            });

            const { data: { session } } = await _client.auth.getSession();
            if (recovery) {
                this.mode = 'reset';
                this.loading = false;
                return;
            }
            if (session) {
                window.location.href = 'today.html';
            } else {
                this.loading = false;
                this.$nextTick(() => lucide.createIcons());
            }
        },
        methods: {
            friendly(error) {
                return (window.FitnessAuth ? FitnessAuth.friendlyError(error?.message) : null) || 'Something went wrong. Try again.';
            },
            toggleSignUp() {
                this.mode = this.mode === 'signup' ? 'login' : 'signup';
            },
            async handleAuth() {
                this.processing = true;
                this.errorMsg = '';
                this.successMsg = '';
                const email = (this.email || '').trim();
                const password = this.password || '';

                try {
                    if (this.mode === 'forgot') {
                        if (!email) {
                            this.errorMsg = 'Enter the email on your account.';
                            return;
                        }
                        const { error } = await _client.auth.resetPasswordForEmail(email, {
                            redirectTo: `${window.location.origin}/index.html`
                        });
                        if (error) this.errorMsg = this.friendly(error);
                        else this.successMsg = 'Check your email for a link to choose a new password.';
                        return;
                    }

                    if (this.mode === 'reset') {
                        if (password.length < 6) {
                            this.errorMsg = 'Use a password with at least 6 characters.';
                            return;
                        }
                        if (password !== this.password2) {
                            this.errorMsg = 'Those passwords don’t match.';
                            return;
                        }
                        const { error } = await _client.auth.updateUser({ password });
                        if (error) this.errorMsg = this.friendly(error);
                        else window.location.href = 'today.html';
                        return;
                    }

                    if (!email || !password) {
                        this.errorMsg = 'Enter your email and a password.';
                        return;
                    }

                    if (this.mode === 'signup') {
                        const { error } = await _client.auth.signUp({ email, password });
                        if (error) this.errorMsg = this.friendly(error);
                        else this.successMsg = 'Check your email to confirm the account, then log in.';
                        return;
                    }

                    const { error } = await _client.auth.signInWithPassword({ email, password });
                    if (error) this.errorMsg = this.friendly(error);
                    else window.location.href = 'today.html';
                } finally {
                    this.processing = false;
                }
            }
        }
    }).mount('#app');
</script>
</body>
</html>
